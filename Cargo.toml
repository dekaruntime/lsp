[package]
name = "deka-lsp"
version = "0.1.0"
edition = "2024"
authors = ["Sami Fouad"]
description = "LSP-over-HTTP language server for deka, consumed by the deka CLI"
license = "Apache-2.0"
repository = "https://github.com/dekaruntime/lsp"
readme = "README.md"
keywords = ["deka", "lsp", "language-server", "dekascript"]
categories = ["development-tools"]
publish = ["crates-io"]

[lib]
crate-type = ["rlib"]

[features]
default = ["native"]
native = ["dep:anyhow", "dep:tokio", "dep:tower-lsp"]

[dependencies]
tower-lsp = { version = "0.20.0", optional = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }
serde_json = { version = "1.0.151" }
serde = { version = "1.0.229", features = ["derive"] }
anyhow = { version = "1.0.104", optional = true }
